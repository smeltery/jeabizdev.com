schema-version = "1.18.0"

[install]
bun.pkg-path = "bun"
bun.version = "1.3.11"
nodejs.pkg-path = "nodejs"
nodejs.version = "24"
git.pkg-path = "git"
git.outputs = "all"
actionlint.pkg-path = "actionlint"
shellcheck.pkg-path = "shellcheck"

[hook]
on-activate = '''
  git -C "$FLOX_ENV_PROJECT" config core.hooksPath .githooks
'''

[services.preview]
command = "bun run dev"

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
